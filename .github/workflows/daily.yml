name: Cruising free daily checker
on:
  schedule:
    - cron: '17 5 * * *' # 07:17 South Africa; GitHub may delay scheduled runs.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cruising-free-checker
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test checker
        run: python3 -m unittest -v
      - name: Check bursary pages
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 checker.py
